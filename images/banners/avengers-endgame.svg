<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Avengers: Endgame backdrop">
  <title>Avengers: Endgame — banner</title>
  <defs>
    <linearGradient id="bg-avengers-endgame-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#843331"/>
      <stop offset="55%" stop-color="#6e2927"/>
      <stop offset="100%" stop-color="#531f1d"/>
    </linearGradient>
    <filter id="soft-avengers-endgame-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-avengers-endgame-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="136" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-avengers-endgame-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-avengers-endgame-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#531f1d" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#531f1d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#531f1d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-avengers-endgame-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#d27971" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d27971" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-avengers-endgame-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-avengers-endgame-bn)"/>
  <g><rect x="278.5" y="349.8" width="640" height="306" fill="#d27971" opacity="0.5" transform="rotate(-16.5 640 360)"/><rect x="148.1" y="209.8" width="992" height="18" fill="#d27971" opacity="0.55" transform="rotate(19.3 800 450)"/><path d="M 461.1 510.9 L 1127.3 216.8 L 539.4 619.1 Z" fill="#d27971" opacity="0.34"/><path d="M 186.4 489.6 L 857.9 333.0 L 493.8 830.9 Z" fill="#d27971" opacity="0.34"/><path d="M 678.8 367.9 L 1513.6 301.1 L 854.7 610.0 Z" fill="#d27971" opacity="0.34"/></g>
  <rect width="1600" height="900" fill="url(#side-avengers-endgame-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-avengers-endgame-bn)" opacity="0.8"/>
  <rect width="1600" height="900" filter="url(#grain-avengers-endgame-bn)" opacity="0.42"/>
</svg>
