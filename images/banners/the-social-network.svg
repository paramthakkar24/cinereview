<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Social Network backdrop">
  <title>The Social Network — banner</title>
  <defs>
    <linearGradient id="bg-the-social-network-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2e5379"/>
      <stop offset="55%" stop-color="#254260"/>
      <stop offset="100%" stop-color="#1c3248"/>
    </linearGradient>
    <filter id="soft-the-social-network-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-the-social-network-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="150" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-the-social-network-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-the-social-network-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c3248" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#1c3248" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1c3248" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-the-social-network-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#739abb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#739abb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-the-social-network-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-the-social-network-bn)"/>
