<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Grand Budapest Hotel backdrop">
  <title>The Grand Budapest Hotel — banner</title>
  <defs>
    <linearGradient id="bg-grand-budapest-hotel-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#964c66"/>
      <stop offset="55%" stop-color="#6d384c"/>
      <stop offset="100%" stop-color="#522a39"/>
    </linearGradient>
    <filter id="soft-grand-budapest-hotel-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-grand-budapest-hotel-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="164" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-grand-budapest-hotel-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-grand-budapest-hotel-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#522a39" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#522a39" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#522a39" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-grand-budapest-hotel-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#de93a7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#de93a7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-grand-budapest-hotel-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-grand-budapest-hotel-bn)"/>
