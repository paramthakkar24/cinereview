<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Interstellar backdrop">
  <title>Interstellar — banner</title>
  <defs>
    <linearGradient id="bg-interstellar-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#875c3d"/>
      <stop offset="55%" stop-color="#855832"/>
      <stop offset="100%" stop-color="#644226"/>
    </linearGradient>
    <filter id="soft-interstellar-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-interstellar-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="108" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-interstellar-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-interstellar-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#644226" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#644226" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#644226" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-interstellar-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#e3af7e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e3af7e" stop-opacity="0"/>
    </radialGradient>
  </defs>

