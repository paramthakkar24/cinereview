<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="La La Land backdrop">
  <title>La La Land — banner</title>
  <defs>
    <linearGradient id="bg-la-la-land-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3e5d84"/>
      <stop offset="55%" stop-color="#314a69"/>
      <stop offset="100%" stop-color="#25384f"/>
    </linearGradient>
    <filter id="soft-la-la-land-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-la-la-land-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="94" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-la-la-land-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-la-la-land-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25384f" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#25384f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#25384f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-la-la-land-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#84a7cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#84a7cc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-la-la-land-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-la-la-land-bn)"/>
  <g><path d="M 269.3 335.9 L 1391.4 247.3 L 1221.1 889.0 Z" fill="#84a7cc" opacity="0.34"/><circle cx="473.32533095031977" cy="384.31654684245586" r="232.56910884752872" fill="#84a7cc" opacity="0.42"/><rect x="410.3" y="351.7" width="640" height="306" fill="#84a7cc" opacity="0.5" transform="rotate(10.1 640 360)"/><path d="M 533.4 467.4 L 1019.8 286.0 L 520.5 634.8 Z" fill="#84a7cc" opacity="0.34"/><rect x="406.1" y="108.0" width="640" height="306" fill="#84a7cc" opacity="0.5" transform="rotate(-7.4 640 360)"/></g>
  <rect width="1600" height="900" fill="url(#side-la-la-land-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-la-la-land-bn)" opacity="0.8"/>
  <rect width="1600" height="900" filter="url(#grain-la-la-land-bn)" opacity="0.42"/>
</svg>
