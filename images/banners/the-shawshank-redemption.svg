<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="The Shawshank Redemption backdrop">
  <title>The Shawshank Redemption — banner</title>
  <defs>
    <linearGradient id="bg-the-shawshank-redemption-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#786642"/>
      <stop offset="55%" stop-color="#6e5c36"/>
      <stop offset="100%" stop-color="#534529"/>
    </linearGradient>
    <filter id="soft-the-shawshank-redemption-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-the-shawshank-redemption-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="192" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-the-shawshank-redemption-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-the-shawshank-redemption-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#534529" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#534529" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#534529" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-the-shawshank-redemption-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#d5bf85" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d5bf85" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-the-shawshank-redemption-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-the-shawshank-redemption-bn)"/>
  <g><g transform="rotate(-3.08 800.0 452.4)">
        <rect x="256.0" y="126.0" width="1088.0" height="652.8"
          fill="none" stroke="#d5bf85" stroke-width="2" opacity="0.50"/>
      </g><g transform="rotate(-1.29 800.0 578.4)">
        <rect x="256.0" y="252.0" width="1088.0" height="652.8"
          fill="none" stroke="#d5bf85" stroke-width="2" opacity="0.43"/>
      </g><g transform="rotate(-0.39 800.0 704.4)">
        <rect x="256.0" y="378.0" width="1088.0" height="652.8"
          fill="none" stroke="#d5bf85" stroke-width="2" opacity="0.36"/>
      </g><g transform="rotate(0.58 800.0 830.4)">
        <rect x="256.0" y="504.0" width="1088.0" height="652.8"
          fill="none" stroke="#d5bf85" stroke-width="2" opacity="0.29"/>
      </g><g transform="rotate(0.43 800.0 956.4)">
        <rect x="256.0" y="630.0" width="1088.0" height="652.8"
          fill="none" stroke="#d5bf85" stroke-width="2" opacity="0.22"/>
      </g><circle cx="800" cy="666" r="135" fill="#d5bf85" opacity="0.55"/></g>
  <rect width="1600" height="900" fill="url(#side-the-shawshank-redemption-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-the-shawshank-redemption-bn)" opacity="0.8"/>
  <rect width="1600" height="900" filter="url(#grain-the-shawshank-redemption-bn)" opacity="0.42"/>
</svg>
