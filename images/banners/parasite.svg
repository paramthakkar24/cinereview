<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Parasite backdrop">
  <title>Parasite — banner</title>
  <defs>
    <linearGradient id="bg-parasite-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#388765"/>
      <stop offset="55%" stop-color="#2a624b"/>
      <stop offset="100%" stop-color="#204a38"/>
    </linearGradient>
    <filter id="soft-parasite-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-parasite-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="80" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-parasite-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-parasite-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#204a38" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#204a38" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#204a38" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-parasite-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#7dd2a8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7dd2a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-parasite-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-parasite-bn)"/>
  <g><ellipse cx="800" cy="495.00000000000006" rx="100.0" ry="36.0"
