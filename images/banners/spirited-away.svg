<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Spirited Away backdrop">
  <title>Spirited Away — banner</title>
  <defs>
    <linearGradient id="bg-spirited-away-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#604b96"/>
      <stop offset="55%" stop-color="#4f3d7b"/>
      <stop offset="100%" stop-color="#3b2e5c"/>
    </linearGradient>
    <filter id="soft-spirited-away-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-spirited-away-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="115" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-spirited-away-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-spirited-away-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b2e5c" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#3b2e5c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b2e5c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-spirited-away-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#a490d6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a490d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-spirited-away-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-spirited-away-bn)"/>
  <g><g transform="rotate(-0.87 800.0 452.4)">
        <rect x="256.0" y="126.0" width="1088.0" height="652.8"
          fill="none" stroke="#a490d6" stroke-width="2" opacity="0.50"/>
      </g><g transform="rotate(-2.72 800.0 578.4)">
        <rect x="256.0" y="252.0" width="1088.0" height="652.8"
          fill="none" stroke="#a490d6" stroke-width="2" opacity="0.43"/>
      </g><g transform="rotate(1.26 800.0 704.4)">
        <rect x="256.0" y="378.0" width="1088.0" height="652.8"
          fill="none" stroke="#a490d6" stroke-width="2" opacity="0.36"/>
      </g><g transform="rotate(-2.75 800.0 830.4)">
        <rect x="256.0" y="504.0" width="1088.0" height="652.8"
          fill="none" stroke="#a490d6" stroke-width="2" opacity="0.29"/>
      </g><g transform="rotate(1.65 800.0 956.4)">
        <rect x="256.0" y="630.0" width="1088.0" height="652.8"
          fill="none" stroke="#a490d6" stroke-width="2" opacity="0.22"/>
      </g><circle cx="800" cy="666" r="135" fill="#a490d6" opacity="0.55"/></g>
  <rect width="1600" height="900" fill="url(#side-spirited-away-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-spirited-away-bn)" opacity="0.8"/>
  <rect width="1600" height="900" filter="url(#grain-spirited-away-bn)" opacity="0.42"/>
</svg>
