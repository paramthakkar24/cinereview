        fill="#73c1d9" opacity="0.088"/><path d="M 529.1712876558304 -10 L 252.21893978118896 945 L 806.1236355304718 945 Z"
        fill="#73c1d9" opacity="0.115"/><rect x="0" y="0" width="1600" height="90" fill="#1b4556" opacity="0.7"/></g>
  <rect width="1600" height="900" fill="url(#side-avatar-the-way-of-water-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-avatar-the-way-of-water-bn)" opacity="0.8"/>
