<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Inception backdrop">
  <title>Inception — banner</title>
  <defs>
    <linearGradient id="bg-inception-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3e539d"/>
      <stop offset="55%" stop-color="#314382"/>
      <stop offset="100%" stop-color="#253262"/>
    </linearGradient>
    <filter id="soft-inception-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-inception-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="87" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-inception-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-inception-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#253262" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#253262" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#253262" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-inception-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#88a5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#88a5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-inception-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-inception-bn)"/>
  <g><g transform="rotate(-39.5 800.0 450.0)">
      <rect x="-1600" y="378.0" width="4800" height="90.0"
        fill="#88a5fd" opacity="0.55"/>
      <rect x="-1600" y="504.0" width="4800" height="31.5"
        fill="#88a5fd" opacity="0.3"/>
      <rect x="-1600" y="594.0" width="4800" height="10.8"
        fill="#88a5fd" opacity="0.18"/>
    </g></g>
  <rect width="1600" height="900" fill="url(#side-inception-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-inception-bn)" opacity="0.8"/>
  <rect width="1600" height="900" filter="url(#grain-inception-bn)" opacity="0.42"/>
</svg>
