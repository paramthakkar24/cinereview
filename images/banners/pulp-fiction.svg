<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Pulp Fiction backdrop">
  <title>Pulp Fiction — banner</title>
  <defs>
    <linearGradient id="bg-pulp-fiction-bn" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#8b393c"/>
      <stop offset="55%" stop-color="#873231"/>
      <stop offset="100%" stop-color="#652625"/>
    </linearGradient>
    <filter id="soft-pulp-fiction-bn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    
    <filter id="grain-pulp-fiction-bn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="108" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-pulp-fiction-bn" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="side-pulp-fiction-bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#652625" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#652625" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#652625" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo-pulp-fiction-bn" cx="72%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#e9837d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e9837d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-pulp-fiction-bn)"/>
  <rect width="1600" height="900" fill="url(#halo-pulp-fiction-bn)"/>
  <g><rect x="-5.0" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="223.6" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="452.1" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="680.7" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="909.3" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="1137.9" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="1366.4" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="1595.0" y="0" width="10" height="900" fill="#652625" opacity="0.68"/><rect x="0.0" y="378.0" width="228.6"
          height="522.0" fill="#e9837d" opacity="0.085"/><rect x="457.1" y="378.0" width="228.6"
          height="522.0" fill="#e9837d" opacity="0.110"/><rect x="914.3" y="378.0" width="228.6"
          height="522.0" fill="#e9837d" opacity="0.074"/><rect x="1371.4" y="378.0" width="228.6"
          height="522.0" fill="#e9837d" opacity="0.061"/></g>
  <rect width="1600" height="900" fill="url(#side-pulp-fiction-bn)"/>
  <rect width="1600" height="900" fill="url(#vig-pulp-fiction-bn)" opacity="0.8"/>
  <rect width="1600" height="900" filter="url(#grain-pulp-fiction-bn)" opacity="0.42"/>
</svg>
