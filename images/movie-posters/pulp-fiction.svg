<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Pulp Fiction poster">
  <title>Pulp Fiction (1994)</title>
  <defs>
    <linearGradient id="bg-pulp-fiction" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#9d3c3c"/>
      <stop offset="60%" stop-color="#712d2e"/>
      <stop offset="100%" stop-color="#552223"/>
    </linearGradient>
    <filter id="soft-pulp-fiction" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-pulp-fiction" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="87" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-pulp-fiction" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-pulp-fiction" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-pulp-fiction)"/>
  <g><path d="M -10 760 L -10 375.0 L 0.0 388.6 L 55.6 415.8 L 111.1 351.3 L 166.7 345.6 L 222.2 401.5 L 277.8 402.8 L 333.3 345.7 L 388.9 355.8 L 444.4 415.7 L 500.0 383.3 L 510 760 Z" fill="#9d3c3c" opacity="0.90"/><path d="M -10 760 L -10 407.5 L 0.0 436.6 L 55.6 384.4 L 111.1 388.7 L 166.7 438.7 L 222.2 424.5 L 277.8 373.5 L 333.3 402.5 L 388.9 441.7 L 444.4 400.6 L 500.0 374.1 L 510 760 Z" fill="#853334" opacity="0.86"/><path d="M -10 760 L -10 440.0 L 0.0 413.5 L 55.6 433.0 L 111.1 467.5 L 166.7 439.3 L 222.2 414.6 L 277.8 450.0 L 333.3 466.4 L 388.9 425.0 L 444.4 423.1 L 500.0 463.8 L 510 760 Z" fill="#6d2b2b" opacity="0.82"/><path d="M -10 760 L -10 472.5 L 0.0 476.6 L 55.6 492.8 L 111.1 461.0 L 166.7 455.7 L 222.2 485.1 L 277.8 487.7 L 333.3 453.7 L 388.9 467.2 L 444.4 492.2 L 500.0 479.8 L 510 760 Z" fill="#552223" opacity="0.78"/></g>
  <rect width="500" height="750" fill="url(#fade-pulp-fiction)"/>
  <rect width="500" height="750" fill="url(#vig-pulp-fiction)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-pulp-fiction)" opacity="0.4"/>

  <line x1="46" y1="521.4" x2="454" y2="521.4"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="706.1"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">1994</text>
  <text x="454" y="706.1"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">8.9</text>

  <text x="46" y="549.9"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">PULP</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">FICTION</text>
</svg>
