<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Parasite poster">
  <title>Parasite (2019)</title>
  <defs>
    <linearGradient id="bg-parasite" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#36775e"/>
      <stop offset="60%" stop-color="#2b644c"/>
      <stop offset="100%" stop-color="#204b39"/>
    </linearGradient>
    <filter id="soft-parasite" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-parasite" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="59" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-parasite" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-parasite" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-parasite)"/>
  <g><g transform="rotate(-1.57 250.0 207.0)">
        <rect x="80.0" y="105.0" width="340.0" height="204.0"
          fill="none" stroke="#7dd2a8" stroke-width="2" opacity="0.50"/>
      </g><g transform="rotate(-0.45 250.0 312.0)">
        <rect x="80.0" y="210.0" width="340.0" height="204.0"
          fill="none" stroke="#7dd2a8" stroke-width="2" opacity="0.43"/>
      </g><g transform="rotate(-1.24 250.0 417.0)">
        <rect x="80.0" y="315.0" width="340.0" height="204.0"
          fill="none" stroke="#7dd2a8" stroke-width="2" opacity="0.36"/>
      </g><g transform="rotate(-0.31 250.0 522.0)">
        <rect x="80.0" y="420.0" width="340.0" height="204.0"
          fill="none" stroke="#7dd2a8" stroke-width="2" opacity="0.29"/>
      </g><g transform="rotate(0.69 250.0 627.0)">
        <rect x="80.0" y="525.0" width="340.0" height="204.0"
          fill="none" stroke="#7dd2a8" stroke-width="2" opacity="0.22"/>
      </g><circle cx="250" cy="555" r="75" fill="#7dd2a8" opacity="0.55"/></g>
  <rect width="500" height="750" fill="url(#fade-parasite)"/>
  <rect width="500" height="750" fill="url(#vig-parasite)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-parasite)" opacity="0.4"/>

  <line x1="46" y1="593.4" x2="454" y2="593.4"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="706.1"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">2019</text>
  <text x="454" y="706.1"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">8.5</text>

  <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">PARASITE</text>
</svg>
