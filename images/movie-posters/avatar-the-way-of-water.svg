  <rect width="500" height="750" fill="url(#fade-avatar-the-way-of-water)"/>
  <rect width="500" height="750" fill="url(#vig-avatar-the-way-of-water)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-avatar-the-way-of-water)" opacity="0.4"/>

  <line x1="46" y1="449.3" x2="454" y2="449.3"
