        fill="none" stroke="#73c1d9" stroke-width="1.25"
        opacity="0.35"/><circle cx="273.7" cy="315.0" r="214.6"
        fill="none" stroke="#73c1d9" stroke-width="1.18"
        opacity="0.32"/><circle cx="273.7" cy="315.0" r="250.4"
        fill="none" stroke="#73c1d9" stroke-width="1.11"
        opacity="0.29"/><circle cx="273.7" cy="315.0" r="286.2"
        fill="none" stroke="#73c1d9" stroke-width="1.04"
        opacity="0.26"/><circle cx="273.7" cy="315.0" r="321.9"
