<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Avatar: The Way of Water poster">
  <title>Avatar: The Way of Water (2022)</title>
  <defs>
    <linearGradient id="bg-avatar-the-way-of-water" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2e7f9d"/>
      <stop offset="60%" stop-color="#23566b"/>
      <stop offset="100%" stop-color="#1a4150"/>
    </linearGradient>
    <filter id="soft-avatar-the-way-of-water" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-avatar-the-way-of-water" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="164" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-avatar-the-way-of-water" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-avatar-the-way-of-water" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-avatar-the-way-of-water)"/>
  <g><circle cx="273.7" cy="315.0" r="35.8"
        fill="none" stroke="#73c1d9" stroke-width="1.53"
        opacity="0.47"/><circle cx="273.7" cy="315.0" r="71.5"
        fill="none" stroke="#73c1d9" stroke-width="1.46"
        opacity="0.44"/><circle cx="273.7" cy="315.0" r="107.3"
        fill="none" stroke="#73c1d9" stroke-width="1.39"
