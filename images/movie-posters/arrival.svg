<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Arrival poster">
  <title>Arrival (2016)</title>
  <defs>
    <linearGradient id="bg-arrival" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#455671"/>
      <stop offset="60%" stop-color="#3f526a"/>
      <stop offset="100%" stop-color="#2f3e50"/>
    </linearGradient>
    <filter id="soft-arrival" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-arrival" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="52" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-arrival" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-arrival" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-arrival)"/>
  <g><g transform="rotate(-1.72 250.0 207.0)">
        <rect x="80.0" y="105.0" width="340.0" height="204.0"
          fill="none" stroke="#90a7c0" stroke-width="2" opacity="0.50"/>
      </g><g transform="rotate(1.58 250.0 312.0)">
        <rect x="80.0" y="210.0" width="340.0" height="204.0"
          fill="none" stroke="#90a7c0" stroke-width="2" opacity="0.43"/>
      </g><g transform="rotate(1.77 250.0 417.0)">
        <rect x="80.0" y="315.0" width="340.0" height="204.0"
          fill="none" stroke="#90a7c0" stroke-width="2" opacity="0.36"/>
      </g><g transform="rotate(0.87 250.0 522.0)">
        <rect x="80.0" y="420.0" width="340.0" height="204.0"
          fill="none" stroke="#90a7c0" stroke-width="2" opacity="0.29"/>
      </g><g transform="rotate(1.87 250.0 627.0)">
        <rect x="80.0" y="525.0" width="340.0" height="204.0"
          fill="none" stroke="#90a7c0" stroke-width="2" opacity="0.22"/>
      </g><circle cx="250" cy="555" r="75" fill="#90a7c0" opacity="0.55"/></g>
  <rect width="500" height="750" fill="url(#fade-arrival)"/>
  <rect width="500" height="750" fill="url(#vig-arrival)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-arrival)" opacity="0.4"/>

  <line x1="46" y1="593.4" x2="454" y2="593.4"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="706.1"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">2016</text>
  <text x="454" y="706.1"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">7.9</text>

  <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">ARRIVAL</text>
</svg>
