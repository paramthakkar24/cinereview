<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Top Gun: Maverick poster">
  <title>Top Gun: Maverick (2022)</title>
  <defs>
    <linearGradient id="bg-top-gun-maverick" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#365a86"/>
      <stop offset="60%" stop-color="#2b496d"/>
      <stop offset="100%" stop-color="#203752"/>
    </linearGradient>
    <filter id="soft-top-gun-maverick" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-top-gun-maverick" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="115" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-top-gun-maverick" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-top-gun-maverick" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-top-gun-maverick)"/>
  <g><circle cx="287.1" cy="149.5" r="70.4"
        fill="#7ca7d4" opacity="0.162"/><circle cx="164.2" cy="592.7" r="79.4"
        fill="#7ca7d4" opacity="0.123"/><circle cx="136.5" cy="168.0" r="146.1"
        fill="#7ca7d4" opacity="0.067"/><circle cx="297.8" cy="749.5" r="152.8"
        fill="#7ca7d4" opacity="0.096"/><circle cx="88.5" cy="144.4" r="109.0"
        fill="#7ca7d4" opacity="0.112"/><circle cx="252.9" cy="36.2" r="95.9"
        fill="#7ca7d4" opacity="0.083"/><circle cx="473.9" cy="14.0" r="153.1"
        fill="#7ca7d4" opacity="0.178"/><circle cx="415.0" cy="642.8" r="162.5"
        fill="#7ca7d4" opacity="0.153"/><circle cx="69.4" cy="256.0" r="98.5"
        fill="#7ca7d4" opacity="0.091"/></g>
  <rect width="500" height="750" fill="url(#fade-top-gun-maverick)"/>
  <rect width="500" height="750" fill="url(#vig-top-gun-maverick)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-top-gun-maverick)" opacity="0.4"/>

  <line x1="46" y1="522.8" x2="454" y2="522.8"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="705.0"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">2022</text>
  <text x="454" y="705.0"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">8.2</text>

  <text x="46" y="551.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">TOP GUN:</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">MAVERICK</text>
</svg>
