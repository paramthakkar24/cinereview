<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="The Godfather poster">
  <title>The Godfather (1972)</title>
  <defs>
    <linearGradient id="bg-the-godfather" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#6c3533"/>
      <stop offset="60%" stop-color="#4b2728"/>
      <stop offset="100%" stop-color="#381d1e"/>
    </linearGradient>
    <filter id="soft-the-godfather" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-the-godfather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="94" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-the-godfather" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-the-godfather" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-the-godfather)"/>
  <g><g transform="rotate(-52.0 250.0 375.0)">
      <rect x="-500" y="315.0" width="1500" height="75.0"
        fill="#af7b73" opacity="0.55"/>
      <rect x="-500" y="420.0" width="1500" height="26.3"
        fill="#af7b73" opacity="0.3"/>
      <rect x="-500" y="495.0" width="1500" height="9.0"
        fill="#af7b73" opacity="0.18"/>
    </g></g>
  <rect width="500" height="750" fill="url(#fade-the-godfather)"/>
  <rect width="500" height="750" fill="url(#vig-the-godfather)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-the-godfather)" opacity="0.4"/>

  <line x1="46" y1="537.6" x2="454" y2="537.6"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="694.4"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">1972</text>
  <text x="454" y="694.4"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">9.2</text>

  <text x="46" y="561.6"
          font-family="Georgia, 'Times New Roman', serif" font-size="57" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">THE</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="57" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">GODFATHER</text>
</svg>
