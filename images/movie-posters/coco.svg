<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Coco poster">
  <title>Coco (2017)</title>
  <defs>
    <linearGradient id="bg-coco" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#9e6d44"/>
      <stop offset="60%" stop-color="#755134"/>
      <stop offset="100%" stop-color="#583d27"/>
    </linearGradient>
    <filter id="soft-coco" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-coco" x="0" y="0" width="100%" height="100%">
