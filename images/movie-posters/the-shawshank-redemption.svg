  <rect width="500" height="750" fill="url(#vig-the-shawshank-redemption)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-the-shawshank-redemption)" opacity="0.4"/>

  <line x1="46" y1="487.4" x2="454" y2="487.4"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="690.2"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">1994</text>
  <text x="454" y="690.2"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">9.3</text>

  <text x="46" y="509.6"
          font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">THE</text>
      <text x="46" y="565.8"
          font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">SHAWSHANK</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">REDEMPTION</text>
