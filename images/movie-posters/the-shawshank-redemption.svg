<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="The Shawshank Redemption poster">
  <title>The Shawshank Redemption (1994)</title>
  <defs>
    <linearGradient id="bg-the-shawshank-redemption" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#806c43"/>
      <stop offset="60%" stop-color="#705e36"/>
      <stop offset="100%" stop-color="#544729"/>
    </linearGradient>
    <filter id="soft-the-shawshank-redemption" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-the-shawshank-redemption" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="171" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-the-shawshank-redemption" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-the-shawshank-redemption" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-the-shawshank-redemption)"/>
  <g><rect x="0" y="360" width="500" height="390" fill="#544729" opacity="0.55"/><line x1="0" y1="360" x2="500" y2="360" stroke="#d5bf85" stroke-width="2" opacity="0.8"/><line x1="250" y1="360" x2="33.3" y2="750"
