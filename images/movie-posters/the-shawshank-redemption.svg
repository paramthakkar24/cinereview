        stroke="#d5bf85" stroke-width="1" opacity="0.3"/><line x1="250" y1="360" x2="433.3" y2="750"
        stroke="#d5bf85" stroke-width="1" opacity="0.3"/><line x1="250" y1="360" x2="466.7" y2="750"
