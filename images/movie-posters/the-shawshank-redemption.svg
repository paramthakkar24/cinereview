        stroke="#d5bf85" stroke-width="1.2" opacity="0.31"/><line x1="0" y1="460.9" x2="500" y2="460.9"
        stroke="#d5bf85" stroke-width="1.4" opacity="0.35"/><line x1="0" y1="513.5" x2="500" y2="513.5"
        stroke="#d5bf85" stroke-width="1.5" opacity="0.39"/><line x1="0" y1="578.8" x2="500" y2="578.8"
        stroke="#d5bf85" stroke-width="1.6" opacity="0.42"/><line x1="0" y1="657.4" x2="500" y2="657.4"
