<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Dune: Part Two poster">
  <title>Dune: Part Two (2024)</title>
  <defs>
    <linearGradient id="bg-dune-part-two" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#815e33"/>
      <stop offset="60%" stop-color="#6a4c27"/>
      <stop offset="100%" stop-color="#50391d"/>
    </linearGradient>
    <filter id="soft-dune-part-two" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-dune-part-two" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="94" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-dune-part-two" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-dune-part-two" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-dune-part-two)"/>
  <g><path d="M 245.32188075827435 787.5 L 308.3592010871507 -75
