<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Avengers: Endgame poster">
  <title>Avengers: Endgame (2019)</title>
  <defs>
    <linearGradient id="bg-avengers-endgame" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#7b3232"/>
      <stop offset="60%" stop-color="#732a27"/>
      <stop offset="100%" stop-color="#56201d"/>
    </linearGradient>
    <filter id="soft-avengers-endgame" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-avengers-endgame" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="115" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-avengers-endgame" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-avengers-endgame" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-avengers-endgame)"/>
  <g><rect x="-5.0" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="66.4" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="137.9" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="209.3" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="280.7" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="352.1" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="423.6" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="495.0" y="0" width="10" height="750" fill="#56201d" opacity="0.68"/><rect x="0.0" y="315.0" width="71.4"
          height="435.0" fill="#d27971" opacity="0.101"/><rect x="142.9" y="315.0" width="71.4"
          height="435.0" fill="#d27971" opacity="0.043"/><rect x="285.7" y="315.0" width="71.4"
          height="435.0" fill="#d27971" opacity="0.074"/><rect x="428.6" y="315.0" width="71.4"
          height="435.0" fill="#d27971" opacity="0.040"/></g>
  <rect width="500" height="750" fill="url(#fade-avengers-endgame)"/>
  <rect width="500" height="750" fill="url(#vig-avengers-endgame)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-avengers-endgame)" opacity="0.4"/>

  <line x1="46" y1="530.2" x2="454" y2="530.2"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="699.7"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">2019</text>
  <text x="454" y="699.7"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">7.9</text>

  <text x="46" y="556.3"
          font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">AVENGERS:</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">ENDGAME</text>
</svg>
