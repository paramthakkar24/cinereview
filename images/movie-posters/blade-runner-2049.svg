<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Blade Runner 2049 poster">
  <title>Blade Runner 2049 (2017)</title>
  <defs>
    <linearGradient id="bg-blade-runner-2049" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#35606f"/>
      <stop offset="60%" stop-color="#2a4d59"/>
      <stop offset="100%" stop-color="#203a43"/>
    </linearGradient>
    <filter id="soft-blade-runner-2049" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-blade-runner-2049" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="122" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-blade-runner-2049" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-blade-runner-2049" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-blade-runner-2049)"/>
  <g><path d="M -10 760 L -10 375.0 L 0.0 384.4 L 55.6 410.8 L 111.1 363.3 L 166.7 339.3 L 222.2 403.1 L 277.8 401.6 L 333.3 343.6 L 388.9 358.7 L 444.4 414.4 L 500.0 383.9 L 510 760 Z" fill="#35606f" opacity="0.90"/><path d="M -10 760 L -10 407.5 L 0.0 431.8 L 55.6 381.9 L 111.1 390.8 L 166.7 440.4 L 222.2 412.2 L 277.8 373.2 L 333.3 406.7 L 388.9 441.6 L 444.4 402.1 L 500.0 373.4 L 510 760 Z" fill="#2e5360" opacity="0.86"/><path d="M -10 760 L -10 440.0 L 0.0 414.4 L 55.6 433.8 L 111.1 467.3 L 166.7 442.9 L 222.2 412.5 L 277.8 447.1 L 333.3 464.2 L 388.9 426.0 L 444.4 423.3 L 500.0 457.3 L 510 760 Z" fill="#274752" opacity="0.82"/><path d="M -10 760 L -10 472.5 L 0.0 474.1 L 55.6 491.9 L 111.1 466.6 L 166.7 453.6 L 222.2 487.8 L 277.8 483.3 L 333.3 456.3 L 388.9 461.8 L 444.4 492.1 L 500.0 475.0 L 510 760 Z" fill="#203a43" opacity="0.78"/></g>
  <rect width="500" height="750" fill="url(#fade-blade-runner-2049)"/>
  <rect width="500" height="750" fill="url(#vig-blade-runner-2049)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-blade-runner-2049)" opacity="0.4"/>

  <line x1="46" y1="449.3" x2="454" y2="449.3"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="706.1"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">2017</text>
  <text x="454" y="706.1"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">8.0</text>

  <text x="46" y="477.8"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">BLADE</text>
      <text x="46" y="549.9"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">RUNNER</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">2049</text>
</svg>
