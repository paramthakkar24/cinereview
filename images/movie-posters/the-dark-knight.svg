<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="The Dark Knight poster">
  <title>The Dark Knight (2008)</title>
  <defs>
    <linearGradient id="bg-the-dark-knight" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#9f7933"/>
      <stop offset="60%" stop-color="#846428"/>
      <stop offset="100%" stop-color="#634b1e"/>
    </linearGradient>
    <filter id="soft-the-dark-knight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="grain-the-dark-knight" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="108" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
    </filter>
    <radialGradient id="vig-the-dark-knight" cx="50%" cy="42%" r="78%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="fade-the-dark-knight" x1="0" y1="0.35" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="62%" stop-color="#000" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg-the-dark-knight)"/>
  <g><circle cx="250" cy="390" r="170" fill="#f5cb73" opacity="0.92"/><rect x="165" y="420.6" width="170.0"
        height="9.3" fill="#846428" opacity="0.92"/><rect x="188.61111111111111" y="442.7" width="122.8"
        height="9.3" fill="#846428" opacity="0.92"/><rect x="201.95652173913044" y="464.8" width="96.1"
        height="9.3" fill="#846428" opacity="0.92"/><rect x="210.53571428571428" y="486.9" width="78.9"
        height="9.3" fill="#846428" opacity="0.92"/><rect x="216.5151515151515" y="509.0" width="67.0"
        height="9.3" fill="#846428" opacity="0.92"/><rect x="220.92105263157896" y="531.1" width="58.2"
        height="9.3" fill="#846428" opacity="0.92"/><rect x="224.30232558139534" y="553.2" width="51.4"
        height="9.3" fill="#846428" opacity="0.92"/>
    <rect x="0" y="540" width="500" height="210" fill="#634b1e" opacity="0.78"/>
    <line x1="0" y1="540" x2="500" y2="540" stroke="#f5cb73" stroke-width="2" opacity="0.75"/></g>
  <rect width="500" height="750" fill="url(#fade-the-dark-knight)"/>
  <rect width="500" height="750" fill="url(#vig-the-dark-knight)" opacity="0.55"/>
  <rect width="500" height="750" filter="url(#grain-the-dark-knight)" opacity="0.4"/>

  <line x1="46" y1="521.4" x2="454" y2="521.4"
    stroke="#ffffff" stroke-width="1" opacity="0.32"/>
  <text x="46" y="706.1"
    font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600"
    fill="#ffffff" opacity="0.82" letter-spacing="5">2008</text>
  <text x="454" y="706.1"
    text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18"
    fill="#ffffff" opacity="0.55" letter-spacing="3">9.0</text>

  <text x="46" y="549.9"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">THE DARK</text>
      <text x="46" y="622.0"
          font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700"
          fill="#ffffff" letter-spacing="-1.4">KNIGHT</text>
</svg>
